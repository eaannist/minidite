# minidite - tmux config (Oh My Posh style: path, session, colors)

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix C-b, repeat last command with C-b C-b
set -g prefix C-b
bind C-b send-prefix

# Split: | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt-arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Status bar (path + session name, Oh My Posh-like colors)
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#21316B,fg=#ffffff"
set -g status-left-length 60
set -g status-left "#[bg=#21316B,fg=#ffffff] #S #[bg=default,fg=#21316B]> "
set -g status-right "#[bg=#3AD900,fg=#000000] #(echo -n '#{pane_current_path}' | sed 's|^'"$HOME"'|~|' | tail -c 45) #[bg=default,fg=#3AD900]> "
set -g status-right-length 80

# Pane border
set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#3AD900"

# Window list
setw -g window-status-format "#[fg=#888888]#I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bold]#I:#W "
setw -g window-status-current-style "bg=#21316B,fg=#ffffff"

# Message
set -g message-style "bg=#FFC600,fg=#000000"

# Colors match Oh My Posh theme (path blue #21316B, git green #3AD900)
