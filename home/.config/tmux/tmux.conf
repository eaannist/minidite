set -g prefix C-a
bind C-a send-prefix
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -s set-clipboard on
unbind c
unbind '"'
unbind %
bind C source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind h send-keys "source ~/.config/tmux/tmux-help.sh" C-m
bind -n C-d detach-client
bind C-d send-keys C-d
bind Right  split-window -h  -c "#{pane_current_path}"
bind Left   split-window -hb -c "#{pane_current_path}"
bind Down   split-window -v  -c "#{pane_current_path}"
bind Up     split-window -vb -c "#{pane_current_path}"
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind q kill-pane
bind w new-window -c "#{pane_current_path}"
bind W next-window
bind r command-prompt -p "Rename window:" "rename-window '%%'"
bind Q confirm-before -p "Kill window #W? (y/n)" kill-window
bind Tab last-window
bind s command-prompt -p "New session name:" "new-session -s '%%'"
bind S switch-client -n
bind R command-prompt -p "Rename session:" "rename-session '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi y      send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind p paste-buffer
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style          "bg=#1c1c1c,fg=#ffffaf"
set -g status-left-length    40
set -g status-left           "#[bg=#ffb347,fg=#000000,bold]  #S #[bg=#1c1c1c,fg=#ffb347]"
set -g status-right-length   60
set -g status-right          "#[fg=#5fafff]#[bg=#5fafff,fg=#000000] #h #[bg=#1c1c1c,fg=#ffffaf] %H:%M %d/%m "
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#5fafff,fg=#000000,bold] #I:#W "
set -g window-status-style          "fg=#888888"
set -g pane-border-lines            single
set -g pane-border-indicators       arrows
set -g pane-border-style            "fg=#00d7d7,bg=#1c1c1c"
set -g pane-active-border-style     "fg=#00d7d7,bg=#1c1c1c"
set -g message-style                "bg=#ffb347,fg=#000000,bold"
